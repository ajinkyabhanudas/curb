name: h3-probe

# CURB-15: reproduce the result hash on other machines. Runs on pushes to the probe branch only.
on:
  push:
    branches: [CURB-15-hash-probe]

permissions:
  contents: read

jobs:
  probe:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: echo "$(uname -sm) node $(node -v)"
      - run: npm ci --ignore-scripts
        working-directory: engine
      - run: sh engine/scripts/h3-probe.sh "$RUNNER_TEMP/h3"
